<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul of Sound // Sanctuary</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070609;
            color: #d4d4d8;
        }
        .title-font {
            font-family: 'Cinzel', serif;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(23, 20, 31, 0.7) 0%, rgba(12, 10, 18, 0.85) 100%);
            border: 1px solid rgba(168, 85, 247, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 12px 40px 0 rgba(168, 85, 247, 0.1);
            transform: translateY(-2px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-16 selection:bg-purple-900 selection:text-purple-200">

    <header class="text-center pt-10 pb-6 px-4 relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-purple-950/30 via-transparent to-transparent pointer-events-none"></div>
        <h1 class="title-font text-2xl font-semibold tracking-widest text-purple-200 drop-shadow-[0_0_15px_rgba(168,85,247,0.4)]">
            ✦ SOUL OF SOUND ✦
        </h1>
        <p class="text-[11px] text-stone-400/80 mt-1 tracking-widest uppercase font-light">Ethereal Oneshot Archives</p>
    </header>

    <nav class="px-4 py-3 max-w-md mx-auto sticky top-0 z-10 bg-[#070609]/80 backdrop-blur-md border-b border-purple-950/20">
        <div id="genre-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar justify-start sm:justify-center"></div>
    </nav>

    <main class="max-w-md mx-auto px-4 mt-6">
        <div id="story-container" class="space-y-4"></div>
    </main>

    <footer class="text-center text-stone-600 text-[10px] mt-12 tracking-widest uppercase font-light">
        Aether & Resonance • Millena Sanctuary
    </footer>

    <script>
        // Data Cerita Kamu (Bisa ditambah/dikurangi/diganti genrenya bebas)
        let stories = [
            {
                judul: "The Phantom of the Hollow Echo",
                genre: "Dark Fantasy",
                durasi: "12 min read",
                tagar: "#Melancholy #Ethereal",
                cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop",
                link: "https://t.me/c/namachannel/1"
            },
            {
                judul: "Symphony of the Blood Moon",
                genre: "Gothic Romance",
                durasi: "8 min read",
                tagar: "#Tragedy #Glow",
                cover: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop",
                link: "https://t.me/c/namachannel/2"
            }
        ];

        let currentFilter = 'Semua';

        function initApp() {
            renderTabs();
            renderStories(currentFilter);
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('genre-tabs');
            const genres = ['Semua', ...new Set(stories.map(s => s.genre))];
            tabsContainer.innerHTML = '';
            
            genres.forEach(genre => {
                const isActive = currentFilter === genre;
                const activeClass = isActive 
                    ? "bg-purple-950/80 text-purple-200 border-purple-700/50 shadow-[0_0_15px_rgba(168,85,247,0.2)]" 
                    : "bg-stone-950/60 text-stone-400 border-stone-800/80 hover:border-purple-900/40";
                
                tabsContainer.innerHTML += `
                    <button onclick="filterGenre('${genre}')" 
                        class="px-4 py-1.5 rounded-full text-xs font-light tracking-wide border whitespace-nowrap transition-all duration-300 ${activeClass}">
                        ${genre === 'Semua' ? '✨ Semua' : genre}
                    </button>
                `;
            });
        }

        function renderStories(filter) {
            const container = document.getElementById('story-container');
            container.innerHTML = '';

            const filtered = filter === 'Semua' ? stories : stories.filter(s => s.genre === filter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-stone-500 text-xs tracking-wider font-light">Tiada gema di ruang ini...</div>`;
                return;
            }

            filtered.forEach(story => {
                container.innerHTML += `
                    <div class="glass-card rounded-2xl overflow-hidden p-3.5 flex gap-3.5 items-center">
                        <div class="relative w-20 h-24 flex-shrink-0 rounded-xl overflow-hidden bg-stone-900 border border-purple-950/50">
                            <img src="${story.cover}" alt="Cover" class="w-full h-full object-cover opacity-90">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <span class="text-[9px] tracking-wider uppercase px-2 py-0.5 rounded-full bg-purple-950/50 text-purple-300/90 border border-purple-900/30">${story.genre}</span>
                                <span class="text-[10px] text-stone-500 font-light">${story.durasi}</span>
                            </div>
                            <h2 class="title-font text-sm font-semibold text-stone-100 mt-2 truncate">${story.judul}</h2>
                            <p class="text-[11px] text-stone-400/70 mt-0.5 tracking-wide">${story.tagar}</p>
                            <div class="mt-3 pt-2 border-t border-purple-950/30 flex justify-end">
                                <a href="${story.link}" target="_blank" 
                                   class="text-[10px] tracking-widest uppercase font-medium text-purple-300 hover:text-purple-100 transition flex items-center gap-1">
                                    Baca Gema ⟶
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterGenre(genreName) {
            currentFilter = genreName;
            renderTabs();
            renderStories(genreName);
        }

        initApp();
    </script>
</body>
</html>
